name: Docs Pages

on:
  pull_request:
  push:
    branches:
      - live
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref_name == 'live' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: ${{ github.event_name != 'pull_request' && github.ref_name == 'live' }}
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
